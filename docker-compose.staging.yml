services:
  postgres:
    image: postgres:16-alpine
    container_name: terra_postgres_staging
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-terra_db}
      POSTGRES_USER: ${DB_USER:-terra_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terra_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - terra_postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-terra_user} -d $${POSTGRES_DB:-terra_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - terra_staging_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.staging
    image: terra-clone-server:staging
    container_name: terra_server_staging
    restart: always
    environment:
      APP_ENV: staging
      PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-terra_db}
      DB_USER: ${DB_USER:-terra_user}
      DB_PASSWORD: ${DB_PASSWORD:-terra_secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - terra_staging_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.staging
    image: terra-clone-nginx:staging
    container_name: terra_nginx_staging
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - server
    networks:
      - terra_staging_network

volumes:
  terra_postgres_staging_data:

networks:
  terra_staging_network:
    name: terra_staging_network
    driver: bridge
