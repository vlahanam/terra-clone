services:
  mysql:
    image: mysql:8.0
    container_name: terra_mysql_staging
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-terra_root_secret}
      MYSQL_DATABASE: ${DB_NAME:-terra_db}
      MYSQL_USER: ${DB_USER:-terra_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-terra_secret}
    ports:
      - "${DB_PORT_EXTERNAL:-3308}:3306"
    volumes:
      - terra_mysql_staging_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - terra_staging_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.staging
    image: terra-clone-server:staging
    container_name: terra_server_staging
    restart: always
    environment:
      APP_ENV: staging
      PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-terra_db}
      DB_USER: ${DB_USER:-terra_user}
      DB_PASSWORD: ${DB_PASSWORD:-terra_secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - terra_staging_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.staging
    image: terra-clone-nginx:staging
    container_name: terra_nginx_staging
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - server
    networks:
      - terra_staging_network

volumes:
  terra_mysql_staging_data:

networks:
  terra_staging_network:
    name: terra_staging_network
    driver: bridge

