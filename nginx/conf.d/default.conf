server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # [VN] Sử dụng DNS nội bộ của Docker (tránh lỗi khởi động khi container upstream chưa sẵn sàng)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # [VN] Endpoint kiểm tra sức khỏe Nginx
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # [VN] Điều hướng API xuống Go Backend server
    location /api {
        set $backend_upstream http://server:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # [VN] Cấu hình timeout cho môi trường phát triển
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # [VN] Điều hướng Frontend Web và hỗ trợ Next.js HMR / WebSockets
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        # [VN] Nâng cấp kết nối WebSocket cho live reload / HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

