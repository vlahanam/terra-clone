services:
  postgres:
    image: postgres:17-alpine
    container_name: terra_postgres_product
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-terra_db}
      POSTGRES_USER: ${DB_USER:-terra_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in production}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Database port is kept private inside Docker network for security
    volumes:
      - terra_postgres_product_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-terra_user} -d $${POSTGRES_DB:-terra_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - terra_product_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.product
    image: terra-clone-server:prod
    container_name: terra_server_product
    restart: always
    environment:
      APP_ENV: production
      PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-terra_db}
      DB_USER: ${DB_USER:-terra_user}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - terra_product_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.product
    image: terra-clone-nginx:prod
    container_name: terra_nginx_product
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - server
    networks:
      - terra_product_network

volumes:
  terra_postgres_product_data:

networks:
  terra_product_network:
    name: terra_product_network
    driver: bridge
