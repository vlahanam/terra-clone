info:
  name: refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{DOMAIN}}/api/v1/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
