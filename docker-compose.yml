services:
  postgres:
    image: postgres:17-alpine
    container_name: terra_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-terra_db}
      POSTGRES_USER: ${DB_USER:-terra_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terra_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - terra_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-terra_user} -d $${POSTGRES_DB:-terra_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - terra_dev_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: terra-clone-server:dev
    container_name: terra_server_dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-terra_db}
      DB_USER: ${DB_USER:-terra_user}
      DB_PASSWORD: ${DB_PASSWORD:-terra_secret}
      DB_SSLMODE: ${DB_SSLMODE}
    ports:
      - "${SERVER_PORT_EXTERNAL:-8090}:8080"
    volumes:
      - ./server:/app
      - terra_go_mod_cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - terra_dev_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: terra-clone-nginx:dev
    container_name: terra_nginx_dev
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - terra_dev_net

volumes:
  terra_postgres_dev_data:
  terra_go_mod_cache:

networks:
  terra_dev_net:
    name: terra_dev_network
    driver: bridge
